{{- if .Values.httpbin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "kong-gateway.labels" . | nindent 4 }}
    app: httpbin
    tier: backend
spec:
  replicas: {{ .Values.httpbin.replicaCount }}
  selector:
    matchLabels:
      app: httpbin
      tier: backend
  template:
    metadata:
      labels:
        app: httpbin
        tier: backend
        {{- include "kong-gateway.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: httpbin
        image: {{ .Values.httpbin.image.repository }}:{{ .Values.httpbin.image.tag }}
        imagePullPolicy: {{ .Values.httpbin.image.pullPolicy }}
        ports:
        - containerPort: 80
          name: http
        resources:
          {{- toYaml .Values.httpbin.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /status/200
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /status/200
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "kong-gateway.labels" . | nindent 4 }}
    app: httpbin
    tier: backend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: httpbin
    tier: backend
{{- end }}