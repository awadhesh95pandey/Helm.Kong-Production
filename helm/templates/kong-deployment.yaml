apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "kong-gateway.labels" . | nindent 4 }}
    app: kong
    component: proxy
  {{- with .Values.kong.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.kong.service.type }}
  {{- if .Values.kong.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.kong.service.loadBalancerIP | quote }}
  {{- end }}
  externalTrafficPolicy: {{ .Values.kong.service.externalTrafficPolicy | default "Local" }}
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
    {{- if .Values.global.tlsEnabled }}
    - port: 443
      targetPort: 8443
      protocol: TCP
      name: https
    {{- end }}
  selector:
    app: kong
    component: gateway
---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "kong-gateway.labels" . | nindent 4 }}
    app: kong
    component: admin
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: admin
    - port: 8444
      targetPort: 8444
      protocol: TCP
      name: admin-ssl
  selector:
    app: kong
    component: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kong-gateway.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "kong-gateway.labels" . | nindent 4 }}
    app: kong
    component: gateway
spec:
  replicas: {{ .Values.kong.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: kong
      component: gateway
  template:
    metadata:
      labels:
        app: kong
        component: gateway
        {{- include "kong-gateway.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: kong
        image: {{ .Values.kong.image.repository }}:{{ .Values.kong.image.tag }}
        imagePullPolicy: {{ .Values.kong.image.pullPolicy }}
        ports:
        - containerPort: 8000
          name: proxy
        - containerPort: 8443
          name: proxy-ssl
        - containerPort: 8001
          name: admin
        - containerPort: 8444
          name: admin-ssl
        - containerPort: 8100
          name: metrics
        env:
        - name: KONG_DATABASE
          value: {{ .Values.kong.database | quote }}
        {{- if eq .Values.kong.database "postgres" }}
        - name: KONG_PG_HOST
          value: "postgres.{{ .Values.namespace.name }}.svc.cluster.local"
        - name: KONG_PG_PORT
          value: "5432"
        - name: KONG_PG_DATABASE
          value: {{ .Values.postgresql.auth.database | quote }}
        - name: KONG_PG_USER
          value: {{ .Values.postgresql.auth.username | quote }}
        - name: KONG_PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.auth.existingSecret | default "postgres-credentials" }}
              key: postgres-password
        {{- end }}
        # Kong environment variables from values.yaml
        {{- range $key, $value := .Values.kong.env }}
        - name: KONG_{{ $key | upper }}
          value: {{ $value | quote }}
        {{- end }}
        # Additional Kong configuration
        - name: KONG_SSL_PROTOCOLS
          value: "TLSv1.2 TLSv1.3"
        - name: KONG_CLIENT_SSL
          value: "off"
        - name: KONG_ADMIN_LISTEN
          value: {{ if .Values.global.tlsEnabled }}"0.0.0.0:8001, 0.0.0.0:8444 ssl"{{ else }}"0.0.0.0:8001"{{ end }}
        - name: KONG_PROXY_LISTEN
          value: {{ if .Values.global.tlsEnabled }}"0.0.0.0:8000, 0.0.0.0:8443 ssl http2"{{ else }}"0.0.0.0:8000"{{ end }}
        {{- if .Values.global.tlsEnabled }}
        - name: KONG_SSL_CERT
          value: "/etc/kong/tls/tls.crt"
        - name: KONG_SSL_CERT_KEY
          value: "/etc/kong/tls/tls.key"
        {{- end }}
        - name: KONG_STATUS_LISTEN
          value: "0.0.0.0:8100"
        resources:
          {{- toYaml .Values.kong.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /status
            port: 8100
          initialDelaySeconds: {{ .Values.kong.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.kong.livenessProbe.periodSeconds }}
        readinessProbe:
          httpGet:
            path: /status
            port: 8100
          initialDelaySeconds: {{ .Values.kong.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.kong.readinessProbe.periodSeconds }}
        {{- if .Values.global.tlsEnabled }}
        volumeMounts:
        - name: kong-proxy-tls
          mountPath: /etc/kong/tls
          readOnly: true
        {{- end }}
      {{- if .Values.global.tlsEnabled }}
      volumes:
      - name: kong-proxy-tls
        secret:
          secretName: kong-proxy-tls
          defaultMode: 420
      {{- end }}
---
{{- if .Values.kong.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "kong-gateway.fullname" . }}-hpa
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "kong-gateway.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "kong-gateway.fullname" . }}
  minReplicas: {{ .Values.kong.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.kong.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.kong.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.kong.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}