{{- if and .Values.kong.database (ne .Values.kong.database "off") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kong-gateway.fullname" . }}-migrations
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "kong-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ include "kong-gateway.fullname" . }}-migrations
      labels:
        {{- include "kong-gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-postgres
        image: postgres:14-alpine
        env:
        - name: PGPASSWORD
          value: "kongpassword"
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for PostgreSQL to be ready..."
          until pg_isready -h postgres.{{ .Values.namespace.name }}.svc.cluster.local -p 5432 -U kong; do
            echo "PostgreSQL is not ready yet. Waiting..."
            sleep 5
          done
          echo "PostgreSQL is ready!"
      containers:
      - name: kong-migrations
        image: {{ .Values.kong.image.repository }}:{{ .Values.kong.image.tag }}
        imagePullPolicy: {{ .Values.kong.image.pullPolicy }}
        env:
        - name: KONG_DATABASE
          value: {{ .Values.kong.database | quote }}
        - name: KONG_PG_HOST
          value: "postgres.{{ .Values.namespace.name }}.svc.cluster.local"
        - name: KONG_PG_PORT
          value: "5432"
        - name: KONG_PG_DATABASE
          value: {{ .Values.postgresql.auth.database | quote }}
        - name: KONG_PG_USER
          value: {{ .Values.postgresql.auth.username | quote }}
        - name: KONG_PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.auth.existingSecret | default "postgres-credentials" }}
              key: postgres-password
        command:
        - "/bin/sh"
        - "-c"
        - |
          echo "Running Kong migrations bootstrap..."
          kong migrations bootstrap
          echo "Running Kong migrations up..."
          kong migrations up
          echo "Running Kong migrations finish..."
          kong migrations finish
          echo "Migrations completed successfully"
{{- end }}