# Production Values for Kong Gateway
# This file contains all production configuration including services, plugins, consumers, and upstreams

global:
  environment: production
  domain: finone.paisalo.in
  tlsEnabled: true

namespace:
  create: true
  name: kong-production

serviceAccount:
  create: true
  name: kong-gateway

kong:
  database: postgres  # Use PostgreSQL for production
  replicaCount: 1
  
  # JWKS configuration for automatic key rotation
  jwks:
    url: https://devtush4r.us.auth0.com/.well-known/jwks.json
    issuer: https://devtush4r.us.auth0.com/
  
  image:
    repository: kong/kong
    tag: "3.4"
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  
  env:
    log_level: "info"  # Changed from warn to info for audit logging
    nginx_worker_processes: "auto"
    mem_cache_size: "256m"
    # Audit logging configuration
    admin_access_log: "/dev/stdout"
    admin_error_log: "/dev/stderr"
    proxy_access_log: "/dev/stdout"
    proxy_error_log: "/dev/stderr"
    # Log format with more details
    nginx_http_log_format: 'json ''{"timestamp":"$time_iso8601","client":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"latency":$request_time,"user":"$http_x_consumer_username"}'''
    # Required for swagger IP restriction (pre-function plugin)
    untrusted_lua: sandbox
  
  service:
    type: LoadBalancer
    loadBalancerIP: "35.200.243.33"
    # Preserve the real client IP (default Cluster SNATs to a node IP and breaks IP allowlists)
    externalTrafficPolicy: Local
    annotations:
      service.beta.kubernetes.io/gcp-load-balancer-type: "External"
  
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 5
  
  # Declarative configuration management
  declarativeConfig:
    enabled: true
    syncSchedule: "0 */4 * * *"  # Sync every 4 hours
  
  # Services configuration
  services:
    # Prod ERP APIs in prod-erp-services, the ERP UI in prod-erp-ui,
    # and pdl-mailingmonk-api in pdl-bulk-mailing.
    # ── PDL COLLECTION API (.NET) ────────────────────────────────────────────────
    # Public URL: https://finone.paisalo.in/pdlcollection
    - name: pdl-collection-api-service
      url: http://pdl-collection-api.prod-erp-services.svc.cluster.local:8080
      protocol: http
      port: 8080
      retries: 3
      connectTimeout: 60000
      writeTimeout: 120000
      readTimeout: 120000
      tags:
        - production
        - nbfc
        - collection
        - dotnet
      routes:
        - name: pdl-collection-api-route
          paths:
            - /pdlcollection
          stripPath: true
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
          preserveHost: false
          regexPriority: 0
          tags:
            - production
            - nbfc
            - collection
            - dotnet

    # ── PDL AUTHENTICATION API ───────────────────────────────────────────────────
    - name: pdl-authentication-api-service
      url: http://pdl-authentication-api.prod-erp-services.svc.cluster.local:8080
