  # Consumers configuration
  consumers:
    - username: auth0-consumer
      customId: auth0-consumer-001
      tags:
        - auth0
        - production
    
    - username: test-consumer
      customId: test-consumer-001
      tags:
        - test
        - production
  
  # Plugins configuration
  plugins:
    # Global rate limiting for all requests (including unauthenticated)
    globalRateLimiting:
      enabled: true
      second: 10000
      minute: 100000
      hour: 10000000
      policy: local
      faultTolerant: true
      limitBy: ip
    
    jwt:
      enabled: false
      services: []
      config:
        uriParamNames: []
        cookieNames: []
        headerNames:
          - authorization
        claimsToVerify:
          - exp
        keyClaimName: iss
        secretIsBase64: false
        anonymous: null
        runOnPreflight: false
        maximumExpiration: 86400  # 24 hours
        algorithm: RS256
    
    rateLimiting:
      enabled: true
      policy: local  # Use 'redis' for distributed rate limiting
      faultTolerant: true
      hideClientHeaders: false
      limitBy: consumer
      headerName: X-RateLimit
      services:
        - name: pdl-collection-api-service
          limits:
            second: 1000
            minute: 50000
            hour: 100000
            day: 1000000
        - name: pdl-authentication-api-service
          limits:
            second: 1000
            minute: 50000
            hour: 100000
            day: 1000000
        - name: pdl-hrmsservices-api-service
          limits:
            second: 1000
            minute: 50000
            hour: 100000
            day: 1000000
        - name: pdl-master-api-service
          limits:
            second: 1000
            minute: 50000
            hour: 100000
            day: 1000000
        - name: pdl-ficaseservice-api-service
          limits:
            second: 1000
            minute: 50000
            hour: 100000
            day: 1000000
        - name: pdl-abf-api-service
          limits:
            second: 1000
            minute: 50000
            hour: 100000
            day: 1000000
        - name: pdl-reportservice-api-service
          limits:
            second: 1000
            minute: 50000
            hour: 100000
            day: 1000000
        - name: pdl-sod-eod-api-service
          limits:
            second: 1000
            minute: 50000
            hour: 100000
            day: 1000000
        - name: pdl-managementservice-api-service
          limits:
            second: 1000
            minute: 50000
            hour: 100000
            day: 1000000
        - name: pdl-mobilecolending-api-service
          limits:
            second: 1000
            minute: 50000
            hour: 100000
            day: 1000000
        - name: react-erp-ui-service
          limits:
            second: 1000
            minute: 10000
            hour: 100000
            day: 1000000
        - name: pdl-mailingmonk-api-service
          limits:
            second: 1000
            minute: 50000
            hour: 100000
            day: 1000000
      redis:
        host: null
        port: 6379
        password: null
        timeout: 2000
        database: 0
    
    requestTransformer:
      enabled: true
      # IMPORTANT: langfuse-service is intentionally excluded
      # Adding it would overwrite the Basic Auth header that Spring Boot sends
      # litellm-service uses its own API key — do NOT add Authorization header here
      services:
        - name: pdl-collection-api-service
          forwardedPrefix: /pdlcollection
        - name: pdl-authentication-api-service
          forwardedPrefix: /authentication
        - name: pdl-hrmsservices-api-service
          forwardedPrefix: /hrmsservices
        - name: pdl-master-api-service
          forwardedPrefix: /master
        - name: pdl-ficaseservice-api-service
          forwardedPrefix: /ficaseservice
        - name: pdl-abf-api-service
          forwardedPrefix: /abf
        - name: pdl-reportservice-api-service
          forwardedPrefix: /reportservice
        - name: pdl-sod-eod-api-service
          forwardedPrefix: /sodeod
        - name: pdl-managementservice-api-service
          forwardedPrefix: /PDLManagement
        - name: pdl-mobilecolending-api-service
          forwardedPrefix: /mobilecolending
        - name: pdl-mailingmonk-api-service
          forwardedPrefix: /pdlmailing
      config:
        add:
          headers:
            - X-Gateway:Kong-3.4-Production
            - X-Forwarded-Proto:https
            - X-Forwarded-Host:finone.paisalo.in
            - X-Forwarded-Port:443

    responseTransformer:
      enabled: true
      services:
        - pdl-collection-api-service
        - pdl-authentication-api-service
        - pdl-hrmsservices-api-service
        - pdl-master-api-service
        - pdl-ficaseservice-api-service
        - pdl-abf-api-service
        - pdl-reportservice-api-service
        - pdl-sod-eod-api-service
        - pdl-managementservice-api-service
        - pdl-mobilecolending-api-service
        - pdl-mailingmonk-api-service
      config:
        add:
          headers:
            - Cache-Control:no-cache, no-store, must-revalidate
            - X-Content-Type-Options:nosniff
            - X-Frame-Options:DENY
            - X-XSS-Protection:1; mode=block
            - Strict-Transport-Security:max-age=31536000; includeSubDomains
        remove:
          headers:
            - Server
            - X-Powered-By
    
    cors:
      enabled: true
      services:
        - pdl-collection-api-service
        - pdl-authentication-api-service
        - pdl-hrmsservices-api-service
        - pdl-master-api-service
        - pdl-ficaseservice-api-service
        - pdl-abf-api-service
        - pdl-reportservice-api-service
        - pdl-sod-eod-api-service
        - pdl-managementservice-api-service
        - pdl-mobilecolending-api-service
        - pdl-mailingmonk-api-service
      config:
        origins:
          - https://finone.paisalo.in 
          - https://predeptest.paisalo.in:8084   # QuantumUI collection frontend
          - https://app.nbfc.com
          - https://admin.nbfc.com
          - https://developer.nbfc.com
          - http://localhost:3000
          - http://localhost:8082   # Spring Boot local dev
          - https://beta.paisalo.in:4016
          - https://testerp.paisalo.in:8825
          - https://predemoui.paisalo.in:4022
        methods:
          - GET
          - HEAD
          - PUT
          - PATCH
          - POST
          - DELETE
          - OPTIONS
        headers:
          - Accept
          - Accept-Version
          - Accept-Language
          - Content-Length
          - Content-Type
          - Date
          - Authorization
          - X-Request-ID
          - X-Correlation-Id
          - X-Page-Id
          - X-Scheduler-Token
        exposedHeaders:
          - X-Auth-Token
          - X-RateLimit-Limit-Minute
          - X-RateLimit-Limit-Hour
          - X-RateLimit-Remaining-Minute
          - X-RateLimit-Remaining-Hour
        credentials: true
        maxAge: 3600
        preflightContinue: false
    
    prometheus:
      enabled: true
      config:
        statusCodeMetrics: true
        latencyMetrics: true
        bandwidthMetrics: true
        upstreamHealthMetrics: true
        perConsumer: true
    
    botDetection:
      enabled: true
      config:
        allow:
          - "(Uptime Robot)"
          - "(Pingdom.com)"
          - "(Google Cloud Monitoring)"
          - "(okhttp)" 
          - "(Java)" 
        deny:
          - "(bot|crawler|spider|scraper)"
    
    # Allow Swagger / OpenAPI UI only from these public IPs
    swaggerIpRestriction:
      enabled: true
      allow:
        - "124.123.16.234"
        - "124.123.16.235"
      pathContains:
        - "/swagger"
        - "/api-docs"
        - "/openapi.json"
        - "/openapi.yaml"
        - "/redoc"

    # HRMS allows large document uploads; keep room above default API payloads
    requestSizeLimiting:
      enabled: true
      config:
        allowedPayloadSize: 100
        sizeUnit: megabytes
        requireContentLength: false
  
  # No Kong upstreams. Routes use service DNS directly.
  upstreams: []

# Httpbin test service (for internal testing)
httpbin:
  enabled: false
  replicaCount: 1
  image:
    repository: kennethreitz/httpbin
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "14-alpine"
  auth:
    database: kong
    username: kong
    existingSecret: ""
  persistence:
    enabled: true
    storageClass: standard
    size: 10Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# Network Policy Configuration
networkPolicy:
  enabled: true  # Enable network policies to restrict traffic

# Pod affinity for high availability
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app
              operator: In
              values:
                - kong-gateway
        topologyKey: kubernetes.io/hostname

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE